<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>解答用紙 - 4択模試マークシート</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --text:#14181f; --muted:#667085;
    --line:#dfe3e8; --accent:#2563eb; --accent-weak:#e8efff;
    --ok:#0f9d58; --ok-weak:#e4f5ec; --ng:#d93838; --ng-weak:#fdeaea;
    --on-ok:#fff; --on-ng:#fff;
    --flag:#e08700; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#11141a; --panel:#181c24; --text:#e8ecf2; --muted:#98a2b3;
      --line:#2a303b; --accent:#5b8cff; --accent-weak:#1d2942;
      --ok:#3ecf8e; --ok-weak:#16302a; --ng:#ff6b6b; --ng-weak:#331d1f;
      --on-ok:#06281c; --on-ng:#3a0d0d;
      --flag:#f0b429; --shadow:none;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-size:16px; line-height:1.5;
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 120px}
  header.app{
    position:sticky;top:0;z-index:20;background:var(--panel);
    border-bottom:1px solid var(--line);padding:10px 0;
  }
  header.app .wrap{padding-bottom:0;display:flex;align-items:center;gap:10px;min-height:44px}
  .app-title{font-size:17px;font-weight:700;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{
    border:1px solid var(--line);background:var(--panel);border-radius:10px;
    padding:9px 14px;font-size:14px;font-weight:600;box-shadow:var(--shadow);
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{box-shadow:none;background:transparent}
  .btn.danger{color:var(--ng);border-color:var(--line)}
  .btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .muted{color:var(--muted);font-size:13px}
  h2{font-size:15px;margin:22px 0 10px;letter-spacing:.02em}
  label.field{display:block;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--muted)}
  label.field input,label.field select{
    display:block;width:100%;margin-top:6px;padding:10px 12px;font-size:16px;font-weight:400;
    background:var(--bg);border:1px solid var(--line);border-radius:10px;
  }
  /* sheet list */
  .sheet-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .sheet-item:last-child{border-bottom:none}
  .sheet-item .grow{flex:1;min-width:0;cursor:pointer}
  .sheet-item .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list{padding:0;overflow:hidden}
  .empty{padding:36px 16px;text-align:center;color:var(--muted)}
  /* toolbar */
  .toolbar{position:sticky;top:65px;z-index:15;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
  .seg button{border:0;background:transparent;padding:9px 14px;font-size:14px;font-weight:600}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .seg.correct button[aria-pressed="true"]{background:var(--ok);color:var(--on-ok)}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
  /* questions */
  .qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:14px}
  .q{
    display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:8px 10px;scroll-margin-top:130px;
  }
  .q.flagged{border-color:var(--flag);box-shadow:inset 3px 0 0 var(--flag)}
  .q .no{width:2.6em;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
  .q .mark{width:1.2em;text-align:center;font-weight:800}
  .q .mark.ok{color:var(--ok)} .q .mark.ng{color:var(--ng)}
  .choices{display:flex;gap:6px;flex:1}
  .choices button{
    flex:1;min-width:0;min-height:42px;border:1px solid var(--line);background:var(--bg);
    border-radius:9px;font-weight:700;font-size:15px;padding:0;
  }
  .choices button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .mode-correct .choices button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
  .choices button.is-correct{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
  .choices button.is-wrong{background:var(--ng);border-color:var(--ng);color:var(--on-ng)}
  .flagbtn{border:0;background:transparent;font-size:16px;line-height:1;padding:6px;color:var(--line)}
  .flagbtn[aria-pressed="true"]{color:var(--flag)}
  /* result */
  .result{margin-top:14px;border-radius:14px;padding:16px;border:1px solid var(--line);background:var(--panel)}
  .score{font-size:30px;font-weight:800;line-height:1.2}
  .score small{font-size:15px;font-weight:600;color:var(--muted)}
  .wrongs{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .wrongs button{border:1px solid var(--ng);color:var(--ng);background:var(--ng-weak);border-radius:8px;padding:3px 9px;font-size:13px;font-weight:700}
  /* bottom bar */
  .bottombar{
    position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);
    border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  }
  .bottombar .wrap{padding-bottom:0;display:flex;align-items:center;gap:10px}
  .progress{flex:1;min-width:0}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}
  .bar span{display:block;height:100%;background:var(--accent);width:0}
  .toast{
    position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(8px);
    background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;
  }
  .toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
  .hidden{display:none !important}
</style>
</head>
<body>
<header class="app">
  <div class="wrap">
    <button class="btn ghost sm" id="backBtn" hidden>← 一覧</button>
    <h1 class="app-title" id="appTitle">解答用紙</h1>
    <button class="btn ghost sm" id="menuBtn" hidden>…</button>
  </div>
</header>

<main class="wrap">
  <!-- ========== 一覧画面 ========== -->
  <section id="viewHome">
    <h2>解答用紙をつくる</h2>
    <div class="card">
      <div class="row" style="gap:12px;align-items:flex-end">
        <label class="field" style="flex:2;min-width:180px;margin:0">
          タイトル
          <input id="newTitle" type="text" placeholder="例）基本情報 模試① 科目A">
        </label>
        <label class="field" style="flex:1;min-width:110px;margin:0">
          問題数
          <input id="newCount" type="number" value="50" min="1" max="500" inputmode="numeric">
        </label>
        <label class="field" style="flex:1;min-width:120px;margin:0">
          選択肢の表記
          <select id="newLabel">
            <option value="number">1 2 3 4</option>
            <option value="alpha">A B C D</option>
            <option value="kana">ア イ ウ エ</option>
          </select>
        </label>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="createBtn">作成して解答をはじめる</button>
      </div>
    </div>

    <h2>保存された解答用紙</h2>
    <div class="card list" id="sheetList"></div>

    <h2>データ</h2>
    <div class="row">
      <button class="btn sm" id="exportAllBtn">全件をJSONで書き出し</button>
      <button class="btn sm" id="importBtn">JSONを読み込み</button>
      <input type="file" id="importFile" accept="application/json,.json" class="hidden">
    </div>
    <p class="muted" style="margin-top:10px">
      解答はこの端末のブラウザ（localStorage）に自動保存されます。端末やブラウザを変えるときは書き出し／読み込みをご利用ください。
    </p>
  </section>

  <!-- ========== 解答画面 ========== -->
  <section id="viewSheet" class="hidden">
    <div class="toolbar">
      <div class="row">
        <div class="seg" id="modeSeg">
          <button data-mode="answer" aria-pressed="true">解答を入力</button>
          <button data-mode="correct" aria-pressed="false">正解を入力</button>
        </div>
        <span class="timer" id="timer">00:00</span>
        <button class="btn sm" id="timerBtn">開始</button>
        <span style="flex:1"></span>
        <button class="btn sm" id="gradeBtn">採点する</button>
      </div>
      <p class="muted" id="modeHint" style="margin:8px 0 0">選んだ選択肢をもう一度押すと取り消せます。</p>
    </div>

    <div id="result" class="result hidden"></div>
    <div class="qgrid" id="qgrid"></div>

    <h2>この解答用紙の操作</h2>
    <div class="row">
      <button class="btn sm" id="addQBtn">問題を10問ふやす</button>
      <button class="btn sm" id="renameBtn">名前と問題数を変更</button>
      <button class="btn sm" id="exportCsvBtn">CSVで書き出し</button>
      <button class="btn sm" id="exportOneBtn">JSONで書き出し</button>
      <button class="btn sm" id="clearAnsBtn">解答をすべて消す</button>
      <button class="btn sm danger" id="deleteBtn">この解答用紙を削除</button>
    </div>
  </section>
</main>

<div class="bottombar hidden" id="bottombar">
  <div class="wrap">
    <div class="progress">
      <div class="muted" id="progressText">0 / 0 問</div>
      <div class="bar"><span id="progressBar"></span></div>
    </div>
    <button class="btn sm" id="jumpBtn">未解答へ</button>
  </div>
</div>

<div class="toast" id="toast">保存しました</div>

<script>
(function(){
  "use strict";
  var KEY = "answer-sheet-v1";
  var LABELS = { number:["1","2","3","4"], alpha:["A","B","C","D"], kana:["ア","イ","ウ","エ"] };
  var db = { sheets:[] };
  var currentId = null;
  var mode = "answer";      // "answer" | "correct"
  var showResult = false;
  var tickTimer = null;

  /* ---------- storage ---------- */
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var p = JSON.parse(raw); if(p && Array.isArray(p.sheets)) db = p; }
    }catch(e){ console.warn("読み込みに失敗:", e); }
    if(!Array.isArray(db.sheets)) db.sheets = [];
  }
  function save(quiet){
    try{
      localStorage.setItem(KEY, JSON.stringify(db));
      if(!quiet) toast("保存しました");
    }catch(e){
      alert("保存できませんでした（ブラウザの保存容量やプライベートモードをご確認ください）\n" + e.message);
    }
  }
  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 1200);
  }

  /* ---------- model ---------- */
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function newSheet(title, count, labelStyle){
    return {
      id: uid(),
      title: title || "無題の解答用紙",
      count: count,
      labelStyle: labelStyle,
      answers: new Array(count).fill(null),
      correct: new Array(count).fill(null),
      flags: new Array(count).fill(false),
      elapsedMs: 0,
      runningSince: null,
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
  }
  function current(){
    for(var i=0;i<db.sheets.length;i++) if(db.sheets[i].id === currentId) return db.sheets[i];
    return null;
  }
  function resize(s, count){
    ["answers","correct","flags"].forEach(function(k){
      var fill = (k === "flags") ? false : null;
      var a = s[k] || [];
      while(a.length < count) a.push(fill);
      s[k] = a.slice(0, count);
    });
    s.count = count;
  }
  function answeredCount(s){ return s.answers.filter(function(v){ return v !== null; }).length; }
  function hasCorrect(s){ return s.correct.some(function(v){ return v !== null; }); }
  function elapsed(s){ return s.elapsedMs + (s.runningSince ? Date.now() - s.runningSince : 0); }
  function fmtTime(ms){
    var t = Math.floor(ms/1000), h = Math.floor(t/3600), m = Math.floor(t%3600/60), sec = t%60;
    var mm = ("0"+m).slice(-2), ss = ("0"+sec).slice(-2);
    return h > 0 ? h + ":" + mm + ":" + ss : mm + ":" + ss;
  }
  function touch(s){ s.updatedAt = Date.now(); }
  function esc(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------- 一覧画面 ---------- */
  function renderHome(){
    var list = document.getElementById("sheetList");
    var sheets = db.sheets.slice().sort(function(a,b){ return b.updatedAt - a.updatedAt; });
    if(!sheets.length){
      list.innerHTML = '<div class="empty">まだ解答用紙がありません。<br>上のフォームから作成してください。</div>';
      return;
    }
    list.innerHTML = sheets.map(function(s){
      var done = answeredCount(s);
      var info = done + " / " + s.count + " 問";
      if(hasCorrect(s)){
        var r = grade(s);
        info += "　正答 " + r.ok + " / " + r.total + "（" + r.rate + "%）";
      }
      info += "　" + new Date(s.updatedAt).toLocaleString("ja-JP");
      return '<div class="sheet-item">' +
               '<div class="grow" data-open="' + s.id + '">' +
                 '<div class="name">' + esc(s.title) + '</div>' +
                 '<div class="muted">' + esc(info) + '</div>' +
               '</div>' +
               '<button class="btn sm" data-open="' + s.id + '">開く</button>' +
             '</div>';
    }).join("");
  }

  /* ---------- 解答画面 ---------- */
  function renderSheet(){
    var s = current(); if(!s) { go("home"); return; }
    document.getElementById("appTitle").textContent = s.title;
    var labels = LABELS[s.labelStyle] || LABELS.number;
    var graded = showResult && hasCorrect(s);

    var html = "";
    for(var i=0;i<s.count;i++){
      var ans = s.answers[i], cor = s.correct[i];
      var mark = "";
      if(graded && cor !== null){
        mark = (ans === cor)
          ? '<span class="mark ok">○</span>'
          : '<span class="mark ng">' + (ans === null ? "−" : "×") + '</span>';
      }
      var buttons = "";
      for(var c=0;c<4;c++){
        var sel = (mode === "correct" ? cor : ans) === c;
        var cls = "";
        if(graded && cor !== null && mode === "answer"){
          if(c === cor) cls = " is-correct";
          else if(c === ans) cls = " is-wrong";
        }
        buttons += '<button type="button" class="' + cls.trim() + '" data-q="' + i + '" data-c="' + c + '"' +
                   ' aria-pressed="' + (sel ? "true" : "false") + '"' +
                   ' aria-label="第' + (i+1) + '問 選択肢' + labels[c] + '">' + labels[c] + '</button>';
      }
      html += '<div class="q' + (s.flags[i] ? " flagged" : "") + '" id="q' + i + '">' +
                '<span class="no">' + (i+1) + '</span>' +
                (mark || (graded ? '<span class="mark"></span>' : "")) +
                '<div class="choices">' + buttons + '</div>' +
                '<button type="button" class="flagbtn" data-flag="' + i + '" aria-pressed="' + (s.flags[i] ? "true":"false") + '" title="見直し">⚑</button>' +
              '</div>';
    }
    var grid = document.getElementById("qgrid");
    grid.className = "qgrid" + (mode === "correct" ? " mode-correct" : "");
    grid.innerHTML = html;

    renderResult(s);
    renderProgress(s);
    updateTimerUI();
    document.getElementById("modeHint").textContent = (mode === "correct")
      ? "正解（解答例）を入力するモードです。入力後「採点する」を押すと結果が出ます。"
      : "選んだ選択肢をもう一度押すと取り消せます。⚑ は見直し用の付箋です。";
  }

  function grade(s){
    var ok=0, total=0, wrong=[], blank=0;
    for(var i=0;i<s.count;i++){
      if(s.correct[i] === null) continue;
      total++;
      if(s.answers[i] === null){ blank++; wrong.push(i); }
      else if(s.answers[i] === s.correct[i]) ok++;
      else wrong.push(i);
    }
    return { ok:ok, total:total, wrong:wrong, blank:blank, rate: total ? Math.round(ok/total*1000)/10 : 0 };
  }

  function renderResult(s){
    var box = document.getElementById("result");
    if(!(showResult && hasCorrect(s))){ box.classList.add("hidden"); box.innerHTML = ""; return; }
    var r = grade(s);
    var wrongHtml = r.wrong.length
      ? '<div class="muted" style="margin-top:10px">まちがえた問題（押すと移動します）</div>' +
        '<div class="wrongs">' + r.wrong.map(function(i){
          return '<button data-jump="' + i + '">' + (i+1) + '</button>';
        }).join("") + '</div>'
      : '<div class="muted" style="margin-top:10px">全問正解です。</div>';
    box.innerHTML =
      '<div class="score">' + r.ok + ' <small>/ ' + r.total + ' 問正解（' + r.rate + '%）</small></div>' +
      '<div class="muted">採点対象 ' + r.total + ' 問中、未解答 ' + r.blank + ' 問・所要時間 ' + fmtTime(elapsed(s)) + '</div>' +
      wrongHtml;
    box.classList.remove("hidden");
  }

  function renderProgress(s){
    var done = answeredCount(s);
    document.getElementById("progressText").textContent = done + " / " + s.count + " 問 解答済み";
    document.getElementById("progressBar").style.width = (s.count ? done/s.count*100 : 0) + "%";
  }

  function updateTimerUI(){
    var s = current(); if(!s) return;
    document.getElementById("timer").textContent = fmtTime(elapsed(s));
    document.getElementById("timerBtn").textContent = s.runningSince ? "一時停止" : (elapsed(s) ? "再開" : "開始");
  }

  /* ---------- 画面切り替え ---------- */
  function go(view, id){
    if(view === "sheet"){
      currentId = id || currentId;
      mode = "answer"; 
      document.getElementById("viewHome").classList.add("hidden");
      document.getElementById("viewSheet").classList.remove("hidden");
      document.getElementById("bottombar").classList.remove("hidden");
      document.getElementById("backBtn").hidden = false;
      setSeg();
      renderSheet();
      window.scrollTo(0,0);
    } else {
      var s = current();
      if(s && s.runningSince){ s.elapsedMs = elapsed(s); s.runningSince = null; save(true); }
      currentId = null; showResult = false;
      document.getElementById("viewSheet").classList.add("hidden");
      document.getElementById("viewHome").classList.remove("hidden");
      document.getElementById("bottombar").classList.add("hidden");
      document.getElementById("backBtn").hidden = true;
      document.getElementById("appTitle").textContent = "解答用紙";
      renderHome();
    }
  }
  function setSeg(){
    document.querySelectorAll("#modeSeg button").forEach(function(b){
      b.setAttribute("aria-pressed", b.dataset.mode === mode ? "true" : "false");
    });
    document.getElementById("modeSeg").className = "seg" + (mode === "correct" ? " correct" : "");
  }

  /* ---------- 書き出し / 読み込み ---------- */
  function download(name, text, type){
    var blob = new Blob([text], { type: type || "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function safeName(str){ return String(str).replace(/[\\/:*?"<>|]/g, "_").slice(0,60) || "answer-sheet"; }
  function toCsv(s){
    var labels = LABELS[s.labelStyle] || LABELS.number;
    var lines = ["問題番号,解答,正解,正誤,見直し"];
    for(var i=0;i<s.count;i++){
      var a = s.answers[i] === null ? "" : labels[s.answers[i]];
      var c = s.correct[i] === null ? "" : labels[s.correct[i]];
      var judge = (s.correct[i] === null) ? "" : (s.answers[i] === null ? "-" : (s.answers[i] === s.correct[i] ? "○" : "×"));
      lines.push([i+1, a, c, judge, s.flags[i] ? "⚑" : ""].join(","));
    }
    return "﻿" + lines.join("\r\n") + "\r\n";
  }
  function importJson(text){
    var data;
    try{ data = JSON.parse(text); }catch(e){ alert("JSONを読み取れませんでした。"); return; }
    var incoming = Array.isArray(data) ? data : (data && Array.isArray(data.sheets) ? data.sheets : (data && data.id ? [data] : null));
    if(!incoming){ alert("解答用紙のデータが見つかりませんでした。"); return; }
    var added = 0;
    incoming.forEach(function(s){
      if(!s || typeof s.count !== "number") return;
      var copy = newSheet(s.title, s.count, LABELS[s.labelStyle] ? s.labelStyle : "number");
      ["answers","correct","flags"].forEach(function(k){ if(Array.isArray(s[k])) copy[k] = s[k].slice(); });
      resize(copy, s.count);
      copy.elapsedMs = typeof s.elapsedMs === "number" ? s.elapsedMs : 0;
      copy.createdAt = s.createdAt || Date.now();
      copy.updatedAt = s.updatedAt || Date.now();
      db.sheets.push(copy); added++;
    });
    save(true); renderHome();
    toast(added + " 件を読み込みました");
  }

  /* ---------- イベント ---------- */
  document.getElementById("createBtn").addEventListener("click", function(){
    var title = document.getElementById("newTitle").value.trim();
    var count = parseInt(document.getElementById("newCount").value, 10);
    var style = document.getElementById("newLabel").value;
    if(!(count >= 1 && count <= 500)){ alert("問題数は 1〜500 で入力してください。"); return; }
    var s = newSheet(title || ("解答用紙 " + new Date().toLocaleDateString("ja-JP")), count, style);
    db.sheets.push(s); save(true);
    document.getElementById("newTitle").value = "";
    go("sheet", s.id);
  });

  document.getElementById("sheetList").addEventListener("click", function(e){
    var t = e.target.closest("[data-open]");
    if(t) go("sheet", t.dataset.open);
  });

  document.getElementById("backBtn").addEventListener("click", function(){ go("home"); });

  document.getElementById("modeSeg").addEventListener("click", function(e){
    var b = e.target.closest("button[data-mode]"); if(!b) return;
    mode = b.dataset.mode; setSeg(); renderSheet();
  });

  document.getElementById("qgrid").addEventListener("click", function(e){
    var s = current(); if(!s) return;
    var btn = e.target.closest("button"); if(!btn) return;

    if(btn.dataset.flag !== undefined){
      var fi = +btn.dataset.flag;
      s.flags[fi] = !s.flags[fi]; touch(s); save(true); renderSheet(); return;
    }
    if(btn.dataset.q === undefined) return;
    var i = +btn.dataset.q, c = +btn.dataset.c;
    var key = (mode === "correct") ? "correct" : "answers";
    s[key][i] = (s[key][i] === c) ? null : c;   // 同じ選択肢をもう一度押すと取り消し
    touch(s); save(true);

    // 押した箇所だけ更新（再描画でのスクロール飛びを防ぐ）
    if(showResult){
      renderSheet();
    } else {
      var row = btn.parentElement.querySelectorAll("button");
      for(var k=0;k<row.length;k++) row[k].setAttribute("aria-pressed", s[key][i] === k ? "true" : "false");
      renderProgress(s);
    }
  });

  document.getElementById("result").addEventListener("click", function(e){
    var b = e.target.closest("[data-jump]"); if(!b) return;
    var el = document.getElementById("q" + b.dataset.jump);
    if(el) el.scrollIntoView({ behavior:"smooth", block:"center" });
  });

  document.getElementById("gradeBtn").addEventListener("click", function(){
    var s = current(); if(!s) return;
    if(!hasCorrect(s)){
      alert("先に「正解を入力」モードで正解を入力してください。");
      mode = "correct"; setSeg(); renderSheet(); return;
    }
    showResult = !showResult;
    if(showResult && mode === "correct"){ mode = "answer"; setSeg(); }
    if(showResult && s.runningSince){ s.elapsedMs = elapsed(s); s.runningSince = null; save(true); }
    document.getElementById("gradeBtn").textContent = showResult ? "採点をとじる" : "採点する";
    renderSheet();
    if(showResult) document.getElementById("result").scrollIntoView({ behavior:"smooth", block:"center" });
  });

  document.getElementById("timerBtn").addEventListener("click", function(){
    var s = current(); if(!s) return;
    if(s.runningSince){ s.elapsedMs = elapsed(s); s.runningSince = null; }
    else { s.runningSince = Date.now(); }
    touch(s); save(true); updateTimerUI();
  });

  document.getElementById("jumpBtn").addEventListener("click", function(){
    var s = current(); if(!s) return;
    for(var i=0;i<s.count;i++){
      if(s.answers[i] === null){
        var el = document.getElementById("q" + i);
        if(el){ el.scrollIntoView({ behavior:"smooth", block:"center" }); }
        return;
      }
    }
    toast("未解答の問題はありません");
  });

  document.getElementById("addQBtn").addEventListener("click", function(){
    var s = current(); if(!s) return;
    resize(s, Math.min(500, s.count + 10)); touch(s); save(); renderSheet();
  });

  document.getElementById("renameBtn").addEventListener("click", function(){
    var s = current(); if(!s) return;
    var title = prompt("タイトル", s.title);
    if(title === null) return;
    var cntStr = prompt("問題数（1〜500）", String(s.count));
    if(cntStr === null) return;
    var cnt = parseInt(cntStr, 10);
    if(!(cnt >= 1 && cnt <= 500)){ alert("問題数は 1〜500 で入力してください。"); return; }
    if(cnt < s.count && !confirm("問題数を減らすと、" + (cnt+1) + "問目以降の解答は削除されます。よろしいですか？")) return;
    s.title = title.trim() || s.title;
    resize(s, cnt); touch(s); save(); renderSheet();
  });

  document.getElementById("clearAnsBtn").addEventListener("click", function(){
    var s = current(); if(!s) return;
    if(!confirm("入力した解答をすべて消します。正解の入力は残ります。よろしいですか？")) return;
    s.answers = new Array(s.count).fill(null);
    s.elapsedMs = 0; s.runningSince = null;
    touch(s); save(); renderSheet();
  });

  document.getElementById("deleteBtn").addEventListener("click", function(){
    var s = current(); if(!s) return;
    if(!confirm("「" + s.title + "」を削除します。元に戻せません。よろしいですか？")) return;
    db.sheets = db.sheets.filter(function(x){ return x.id !== s.id; });
    currentId = null; save(); go("home");
  });

  document.getElementById("exportCsvBtn").addEventListener("click", function(){
    var s = current(); if(!s) return;
    download(safeName(s.title) + ".csv", toCsv(s), "text/csv;charset=utf-8");
  });
  document.getElementById("exportOneBtn").addEventListener("click", function(){
    var s = current(); if(!s) return;
    download(safeName(s.title) + ".json", JSON.stringify(s, null, 2));
  });
  document.getElementById("exportAllBtn").addEventListener("click", function(){
    if(!db.sheets.length){ alert("書き出すデータがありません。"); return; }
    download("answer-sheets.json", JSON.stringify(db, null, 2));
  });
  document.getElementById("importBtn").addEventListener("click", function(){
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){ importJson(String(reader.result)); };
    reader.readAsText(file);
    e.target.value = "";
  });

  // 実行中のタイマー表示更新 & 離脱時の保存
  tickTimer = setInterval(function(){
    var s = current();
    if(s && s.runningSince && !document.getElementById("viewSheet").classList.contains("hidden")) updateTimerUI();
  }, 1000);
  window.addEventListener("beforeunload", function(){
    var s = current();
    if(s && s.runningSince){ s.elapsedMs = elapsed(s); s.runningSince = null; }
    try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){}
  });

  load();
  renderHome();
})();
</script>
</body>
</html>
